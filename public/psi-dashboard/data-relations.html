/* Hallmark · macrostructure: dense analytical canvas · genre: modern-minimal · tone: utilitarian · anchor: warm olive */
/* Hallmark · pre-emit critique: P5 H4 E5 S5 R5 V4 */

.analytics-page {
  --lieflat-surface: var(--color-foreground-surface-data);
  --lieflat-control: var(--color-foreground-surface-control);
  --lieflat-selected: var(--color-foreground-brand-soft);
  --lieflat-text: var(--color-analytics-text);
  --lieflat-muted: var(--color-analytics-muted);
  --lieflat-hero: var(--color-analytics-hero);
  --lieflat-grid: var(--color-analytics-grid);
  color: var(--lieflat-text);
  font-family: var(--typography-family-sans);
}

.analytics-page .lieflat-card,
.analytics-page .decision-overview-card,
.analytics-page .supply-panel,
.analytics-page .gmipo-calendar-empty {
  background: var(--lieflat-surface);
  border: 1px solid var(--lieflat-grid);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-glass);
  backdrop-filter: none;
}

.analytics-page.glass-card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  backdrop-filter: none;
}

.analytics-page .lieflat-card {
  padding: var(--space-5) var(--space-6);
  display: grid;
  gap: var(--space-3);
  min-width: 0;
}

.analytics-page .decision-overview-card-body > .lieflat-card {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.analytics-page .lieflat-card h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: var(--typography-weight-strong);
  letter-spacing: -0.01em;
}

.analytics-page .lieflat-card .lieflat-sub {
  margin: 0;
  color: var(--lieflat-muted);
  font-size: 0.82rem;
  line-height: 1.45;
}

.analytics-page .lieflat-card .lieflat-src,
.analytics-page .lieflat-src {
  margin: 0;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lieflat-muted);
}

.analytics-page .lieflat-chart-scroll {
  overflow-x: auto;
  min-width: 0;
}

.analytics-page .lieflat-chart {
  width: 100%;
  height: auto;
  display: block;
}

/* viewBox units; each chart sizes its viewBox near its rendered width so 11 ≈ 10–11px on screen */
.analytics-page .lieflat-chart text {
  font-family: inherit;
  font-size: 11px;
  fill: var(--lieflat-text);
}

.analytics-page .lieflat-chart .lieflat-row-label {
  font-weight: 600;
}

.analytics-page .lieflat-chart .lieflat-cell-label {
  font-size: 10px;
  font-weight: 600;
}

.analytics-page .lieflat-chart .lieflat-caption {
  font-size: 10px;
  fill: var(--lieflat-muted);
}

.analytics-page .lieflat-plumb-scatter .lieflat-caption,
.analytics-page .lieflat-plumb-scatter .lieflat-cell-label,
.analytics-page .lieflat-stream-ribbon .lieflat-caption {
  paint-order: stroke;
  stroke: var(--lieflat-surface);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.analytics-page .lieflat-chart .lieflat-donut-total {
  font-size: 22px;
  font-weight: var(--typography-weight-heavy);
}

.analytics-page .lieflat-chart [role="button"] {
  cursor: pointer;
  outline: none;
}

.analytics-page .lieflat-chart [role="button"]:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.analytics-page .lieflat-chart [role="button"][aria-pressed="true"] {
  outline: 2px solid var(--lieflat-hero);
  outline-offset: 1px;
}

.analytics-page .lieflat-tick-row.is-clickable:hover text,
.analytics-page .lieflat-tick-row.is-clickable:focus-visible text {
  fill: var(--lieflat-hero);
}

.analytics-page .lieflat-reveal { animation: none; }

.analytics-page .gmipo-calendar-heading .eyebrow,
.analytics-page .decision-overview-card-heading .eyebrow,
.analytics-page .supply-bridge-heading .eyebrow {
  color: var(--lieflat-muted);
}

.analytics-page .gmipo-calendar-heading h2,
.analytics-page .decision-overview-header .gmipo-calendar-heading h2,
.analytics-page .decision-overview-card-heading h3,
.analytics-page .supply-bridge-heading h3 {
  color: var(--lieflat-text);
}

.analytics-page .gmipo-calendar-heading p,
.analytics-page .decision-overview-card-heading p:not(.eyebrow),
.analytics-page .supply-bridge-heading p,
.analytics-page .decision-inline-note,
.analytics-page .supply-decision-toolbar > p {
  color: var(--lieflat-muted);
}

.analytics-page .decision-overview-grid,
.analytics-page .supply-decision-layout,
.analytics-page .gmipo-calendar-toolbar,
.analytics-page .gmipo-calendar-context {
  gap: var(--space-5);
}

.analytics-page .decision-overview-scope,
.analytics-page .supply-decision-toolbar,
.analytics-page .gmipo-calendar-toolbar {
  border: 1px solid var(--lieflat-grid);
  background: var(--lieflat-control);
  border-radius: var(--radius-md);
}

.analytics-page .decision-overview-scope > span {
  border-right-color: var(--lieflat-grid);
}

.analytics-page .decision-overview-scope small,
.analytics-page .supply-decision-toolbar label,
.analytics-page .gmipo-calendar-filters label {
  color: var(--lieflat-muted);
}

.analytics-page .decision-overview-scope strong,
.analytics-page .gmipo-calendar-selection strong {
  color: var(--lieflat-text);
}

.analytics-page .decision-card-badge {
  background: var(--color-state-neutral-soft);
  color: var(--lieflat-text);
}

.analytics-page .supply-heatmap button,
.analytics-page .gmipo-calendar-selection-pill {
  border-radius: var(--radius-sm);
  font-weight: var(--typography-weight-strong);
}

.analytics-page .supply-risk-button.is-selected,
.analytics-page .supply-heatmap button.is-selected {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 1px;
}

.analytics-page .supply-variance-table {
  font-size: 0.82rem;
}

/* 分頁切換＝月度／年度同款藥丸軌道；外層不要上底色，否則圓角外會露灰 */
.analytics-page .data-relations-mode-switch {
  gap: var(--space-1);
  padding: var(--space-1);
  border: 1px solid var(--lieflat-grid);
  border-radius: var(--radius-pill);
  background: var(--lieflat-control);
}

.analytics-page .data-relations-mode-switch .page-tab {
  min-height: 36px;
  padding: 0 var(--space-4);
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  box-shadow: none;
  color: var(--lieflat-muted);
}

.analytics-page .data-relations-mode-switch .page-tab.is-active {
  background: var(--lieflat-selected);
  color: var(--color-foreground-brand-strong);
}

.analytics-page .chip-select {
  background: transparent;
  border: 0;
}

.analytics-page .chip-select .custom-select-trigger,
.analytics-page .gmipo-calendar-mode-switch button,
.analytics-page .supply-period-switch button {
  border-color: var(--lieflat-grid);
  color: var(--lieflat-text);
}

.analytics-page .chip-select .custom-select-trigger {
  background: var(--lieflat-surface);
}

.analytics-page .gmipo-calendar-mode-switch {
  border: 1px solid var(--lieflat-grid);
  background: var(--lieflat-control);
}

.analytics-page .gmipo-calendar-mode-switch button:not(.is-active),
.analytics-page .supply-period-switch button:not(.is-selected) {
  background: transparent;
  color: var(--lieflat-muted);
}

.analytics-page .gmipo-calendar-mode-switch button.is-active,
.analytics-page .supply-period-switch button.is-selected {
  background: var(--lieflat-selected);
  color: var(--color-foreground-brand-strong);
}

.analytics-page .chip-select .custom-select-trigger:focus-visible,
.analytics-page button:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.analytics-page .gmipo-calendar-selection-pill,
.analytics-page .gmipo-calendar-selection-pill.is-line,
.analytics-page .gmipo-calendar-selection-pill.is-total {
  background: var(--color-state-neutral-soft);
  color: var(--lieflat-text);
  border: 1px solid var(--lieflat-grid);
}

.analytics-page .gmipo-calendar-legend,
.analytics-page .gmipo-calendar-selection {
  color: var(--lieflat-muted);
}

.analytics-page .gmipo-calendar-legend-swatch {
  border-color: var(--lieflat-grid);
}

.analytics-page .gmipo-calendar-legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  white-space: nowrap;
}

.analytics-page .gmipo-calendar-legend > small {
  flex-basis: 100%;
}

.analytics-page .gmipo-calendar-empty {
  min-height: 220px;
  place-content: center;
  text-align: center;
  padding: var(--space-7);
}

.analytics-page .gmipo-calendar-empty strong,
.analytics-page .architecture-note-card h3 {
  color: var(--lieflat-text);
}

.analytics-page .gmipo-calendar-empty p,
.analytics-page .architecture-note-card li {
  color: var(--lieflat-muted);
}

.analytics-page .decision-overview-legend i {
  box-sizing: border-box;
}

.analytics-page .decision-data-details summary {
  cursor: pointer;
  color: var(--lieflat-muted);
  font-size: 0.82rem;
}

.analytics-page .decision-overview-grid .is-gmipo-phases { grid-column: span 6; }
.analytics-page .decision-overview-grid .is-gmipo-brands { grid-column: span 6; }
.analytics-page .decision-overview-grid .is-gmipo-matrix,
.analytics-page .decision-overview-grid .is-gmipo-year,
.analytics-page .decision-overview-grid .is-gmipo-months,
.analytics-page .decision-overview-grid .is-arch-regions,
.analytics-page .decision-overview-grid .is-arch-fanout,
.analytics-page .decision-overview-grid .is-arch-notes { grid-column: 1 / -1; }

.analytics-page .architecture-note-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
}

.analytics-page .architecture-note-card {
  display: grid;
  gap: var(--space-2);
}

.analytics-page .architecture-note-card h3 {
  margin: 0;
  font-size: 0.95rem;
}

.analytics-page .architecture-note-card ul {
  margin: 0;
  padding-left: 1.1em;
  display: grid;
  gap: var(--space-2);
  font-size: 0.82rem;
  line-height: 1.45;
}

.analytics-page .analytics-count-summary {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-5);
  font-size: 0.82rem;
}

.analytics-page .supply-decision-layout {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.analytics-page .supply-heatmap {
  min-width: 620px;
}

.analytics-page .supply-heatmap th,
.analytics-page .supply-heatmap td small {
  font-size: 11px;
}

.analytics-page .supply-heatmap th:first-child {
  width: 160px;
}

.analytics-page .supply-heatmap tbody th small {
  font-size: 11px;
  white-space: normal;
  overflow-wrap: anywhere;
}

.analytics-page .supply-ranking-total {
  min-width: 118px;
  padding: var(--space-1) var(--space-2);
  font-size: 12px;
  text-align: right;
}

.analytics-page .analytics-value-track {
  display: block;
  height: 4px;
  margin: var(--space-1) 0;
  background: var(--color-analytics-ramp-1);
}

.analytics-page .analytics-value-track i {
  display: block;
  height: 100%;
  background: var(--color-analytics-data);
}

.analytics-page .supply-heatmap tr.is-selected .analytics-value-track i {
  background: var(--lieflat-hero);
}

.analytics-page .decision-summary-matrix {
  width: 100%;
  min-width: 620px;
  border-collapse: collapse;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.analytics-page .decision-summary-matrix th,
.analytics-page .decision-summary-matrix td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--lieflat-grid);
  text-align: right;
  vertical-align: top;
}

.analytics-page .decision-summary-matrix th:first-child {
  text-align: left;
  width: 118px;
}

.analytics-page .decision-summary-matrix small {
  display: block;
  font-size: 11px;
}

.analytics-page .decision-summary-matrix ul {
  list-style: none;
  padding: 0;
  line-height: 1.8;
}

.analytics-page .decision-summary-matrix summary,
.analytics-page .decision-source-details > summary {
  cursor: pointer;
}

.analytics-page .decision-overview-grid .is-risk {
  grid-column: 1 / -1;
}

.analytics-page .decision-source-details {
  min-width: 0;
  padding: var(--space-5) var(--space-6);
}

@media (max-width: 900px) {
  .analytics-page .architecture-note-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 1180px) {
  .analytics-page .supply-decision-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .analytics-page .decision-overview-grid .decision-overview-card {
    grid-column: 1 / -1;
  }
}

@media (max-width: 780px) {
  .analytics-page .decision-overview-grid .is-gmipo-phases,
  .analytics-page .decision-overview-grid .is-gmipo-brands,
  .analytics-page .decision-overview-grid .is-gmipo-matrix,
  .analytics-page .decision-overview-grid .is-gmipo-year,
  .analytics-page .decision-overview-grid .is-gmipo-months,
  .analytics-page .decision-overview-grid .is-arch-regions,
  .analytics-page .decision-overview-grid .is-arch-fanout,
  .analytics-page .decision-overview-grid .is-arch-notes { grid-column: auto; }
}

/* Hallmark · macrostructure: Workbench · tone: calm utilitarian · anchor hue: warm olive · system: DESIGN.md */
/* Hallmark · pre-emit critique: P5 H4 E4 S5 R4 V4 · shared A direction and single font explicitly approved */

/* Warm A: shared semantic tokens from DESIGN.md. */
:root {
  color-scheme: light;
  --bg: var(--color-page-background-base);
  --glass: var(--color-foreground-surface-data);
  --glass-hover: var(--color-foreground-surface-data-hover);
  --glass-strong: var(--color-foreground-surface-strong);
  --control-surface: var(--color-foreground-surface-control);
  --accent-warm: var(--color-foreground-accent-warm);
  --glass-border: var(--color-foreground-border);
  --ink: var(--color-foreground-text-primary);
  --muted: var(--color-foreground-text-muted);
  --line: var(--color-foreground-line);
  --line-strong: var(--color-foreground-line-strong);
  --brand: var(--color-foreground-brand);
  --brand-strong: var(--color-foreground-brand-strong);
  --brand-soft: var(--color-foreground-brand-soft);
  --tab-edge: var(--line);
  --brand-rgb: 117, 98, 63;
  --brand-deep-rgb: 61, 68, 57;
  --neon-pink: var(--color-brand-pink);
  --neon-cyan: var(--color-brand-cyan);
  --red: var(--color-state-danger);
  --amber: var(--color-state-warning);
  --emerald: var(--color-state-success);
  --page-max: 1920px;
  --page-gutter: var(--space-page-gutter);
  --motion-fast: 160ms;
  --motion-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

* {
  box-sizing: border-box;
}

/* 瀏覽器內建的 [hidden] { display: none } 屬於 user-agent origin，任何作者樣式
   （例如 .icon-button 的 display: inline-flex）都會贏過它，導致同時帶 class 與
   hidden 屬性的元素其實藏不起來。這裡用作者 origin + !important 把 hidden 的
   語意搶回來，讓 el.hidden = true 在全站一律有效。
   注意：本專案沒有使用 hidden="until-found"（該值需要 display 可被覆寫才能
   由瀏覽器的頁內搜尋展開），若日後要用，需改成 [hidden]:not([hidden="until-found"])。 */
[hidden] {
  display: none !important;
}

html {
  min-height: 100%;
  overflow-x: clip;
  background: var(--bg);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: clip;
  background: transparent;
  color: var(--ink);
  font-family: var(--typography-family-sans);
  font-optical-sizing: auto;
  font-weight: var(--typography-weight-regular);
  font-size: 14px;
  line-height: 1.5;
}



button,
input,
select,
textarea,
code,
pre,
kbd {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

#app {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  padding-bottom: 34px;
}

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 2000;
  padding: 10px 14px;
  border: 2px solid var(--color-state-focus-ring);
  border-radius: var(--radius-sm);
  background: var(--glass-strong);
  color: var(--brand-strong);
  font-weight: 500;
  text-decoration: none;
  transform: translateY(calc(-100% - 20px));
  transition: transform var(--motion-fast) var(--motion-ease-out);
}

.skip-link:focus-visible {
  outline: 3px solid var(--color-state-focus-ring);
  outline-offset: 2px;
  transform: translateY(0);
}

.background-layer { display: none; }

.glass-panel,
.glass-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--glass);
  box-shadow: var(--shadow-glass);
  backdrop-filter: none;
}

.glass-card {
  border-radius: var(--radius-lg);
}

.icon {
  display: inline-flex;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  line-height: 0;
}

.icon svg {
  display: block;
  width: 100%;
  height: 100%;
  fill: currentColor;
  stroke: none;
}

.icon.icon-art {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-xs);
}

.icon-art img {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
}

.app-header {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: min(calc(100% - (var(--page-gutter) * 2)), var(--page-max));
  min-height: 0;
  margin: 0 auto;
  padding: 24px 0 16px;
  overflow: visible;
  border: 0;
  border-bottom: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.brand {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 0;
}

.brand-mark {
  display: none;
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 1px solid rgba(var(--brand-rgb), 0.28);
  border-radius: var(--radius-md);
  background: rgba(var(--brand-rgb), 0.11);
  color: var(--brand-strong);
  box-shadow: var(--shadow-glass);
  font-size: 13px;
  font-weight: 500;
}

.brand-copy {
  min-width: 0;
}

.brand h1 {
  margin: 2px 0 3px;
  font-size: var(--typography-page-title-size);
  font-weight: var(--typography-page-title-weight);
  line-height: var(--typography-page-title-line-height);
  letter-spacing: 0;
}

.brand p {
  max-width: 520px;
  margin: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.eyebrow {
  margin: 0;
  color: var(--brand-strong);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: none;
}

.source-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.filter-chips {
  display: flex;
  min-width: 0;
  flex: 0 1 auto;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 8px;
}

.release-health-notice {
  position: relative;
  z-index: 2;
  display: flex;
  width: min(calc(100% - (var(--page-gutter) * 2)), var(--page-max));
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 auto 12px;
  padding: 10px 14px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-glass-strong);
  color: var(--color-text-secondary);
  box-shadow: var(--shadow-glass);
}

.release-health-notice strong {
  color: var(--color-text-primary);
  white-space: nowrap;
}

.release-health-notice.is-warning {
  border-color: var(--color-risk-warning);
}

.release-health-notice.is-critical {
  border-color: var(--color-risk-critical);
}

.release-health-notice.is-info {
  border-color: var(--color-risk-info);
}

.meta-chip,
.filter-chip,
.mod-badge,
.action-badge {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  border: 1px solid rgba(var(--brand-rgb), 0.18);
  border-radius: 999px;
  background: var(--color-surface-glass);
  color: var(--color-text-muted);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.meta-chip,
.filter-chip {
  padding: 5px 10px;
}

.filter-chip {
  gap: 4px;
  padding-right: 6px;
}

.filter-chip-clear {
  display: inline-flex;
  flex: 0 0 16px;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  transition: transform var(--motion-fast) var(--motion-ease-out), opacity var(--motion-fast) var(--motion-ease-out);
}

.filter-chip-clear:hover {
  background: rgba(var(--brand-rgb), 0.12);
}

.filter-chip-clear:active {
  transform: scale(0.97);
}

.filter-chip-clear:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 1px;
}

.app-header .source-meta {
  gap: 0;
}

.app-header .brand-mark,
.app-header .meta-chip {
  box-shadow: none;
}

.app-header .brand-mark {
  background: transparent;
}

.app-header .meta-chip {
  min-height: auto;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--color-text-secondary);
}

.app-header .meta-chip + .meta-chip::before {
  margin: 0 8px;
  color: var(--muted);
  content: "\00b7";
}

.meta-chip.is-cyan {
  border-color: color-mix(in srgb, var(--color-state-info) 22%, transparent);
  background: color-mix(in srgb, var(--color-state-info) 9%, transparent);
  color: var(--color-state-info);
}

.meta-chip.is-modified,
.mod-badge {
  border-color: rgba(var(--brand-rgb), 0.3);
  background: var(--brand-soft);
  color: var(--brand-strong);
  box-shadow: 0 8px 22px -16px rgba(var(--brand-deep-rgb), 0.48);
}

.mod-badge {
  min-height: 22px;
  padding: 2px 7px;
  font-size: 11px;
}

.mod-badge.inline {
  min-height: 18px;
  padding: 1px 6px;
  font-size: 10px;
}

.mod-badge.muted,
.muted-chip {
  border-color: var(--color-foreground-line);
  background: var(--color-surface-glass);
  color: var(--muted);
  box-shadow: none;
}

.save-status {
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.save-status.is-saving {
  border-color: color-mix(in srgb, var(--color-state-info) 24%, transparent);
  background: color-mix(in srgb, var(--color-state-info) 10%, transparent);
  color: var(--color-state-info);
}

.save-status.is-success {
  border-color: color-mix(in srgb, var(--color-state-success) 24%, transparent);
  background: color-mix(in srgb, var(--color-state-success) 11%, transparent);
  color: var(--color-state-success);
}

.save-status.is-error {
  border-color: color-mix(in srgb, var(--color-state-danger) 26%, transparent);
  background: color-mix(in srgb, var(--color-state-danger) 10%, transparent);
  color: var(--color-state-danger);
}

.save-toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 1400;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 12px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--glass-strong);
  box-shadow: var(--shadow-lift);
  color: var(--ink);
  font-weight: 500;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 16px) scale(0.97);
  transition:
    transform var(--motion-fast) var(--motion-ease-out),
    opacity var(--motion-fast) var(--motion-ease-out);
}

.save-toast.is-open {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

.save-toast.is-success {
  border-color: var(--color-state-success);
  background: var(--glass);
  color: var(--color-state-success);
}

.save-toast.is-error {
  border-color: var(--color-state-danger);
  background: var(--glass);
  color: var(--color-state-danger);
}

.form-field.is-shaking,
.add-row-form .custom-select.is-shaking,
.add-row-form .control-input.is-shaking {
  animation: fieldShake 280ms linear;
}

@keyframes fieldShake {
  0% { transform: translateX(0); }
  28.57% { transform: translateX(6px); }
  57.14% { transform: translateX(-6px); }
  78.57% { transform: translateX(4px); }
  100% { transform: translateX(0); }
}

.action-badge {
  min-height: 28px;
  padding: 4px 9px;
  border-color: var(--color-foreground-line);
  background: var(--color-surface-glass);
  color: var(--color-text-muted);
  justify-content: center;
}

.action-badge.is-pull-in {
  border-color: var(--color-action-pull-in-border);
  background: var(--color-action-pull-in-background);
  color: var(--color-action-pull-in-text);
}

.action-badge.is-push-out {
  border-color: var(--color-action-push-out-border);
  background: var(--color-action-push-out-background);
  color: var(--color-action-push-out-text);
}

.action-badge.is-borrow {
  border-color: var(--color-action-borrow-border);
  background: var(--color-action-borrow-background);
  color: var(--color-action-borrow-text);
}

.action-badge.is-po {
  border-color: var(--color-action-purchase-border);
  background: var(--color-action-purchase-background);
  color: var(--color-action-purchase-text);
}

.action-badge.is-no-limit {
  border-color: var(--color-action-no-limit-border);
  background: var(--color-action-no-limit-background);
  color: var(--color-action-no-limit-text);
}

.action-badge.is-done {
  border-color: var(--color-action-done-border);
  background: var(--color-action-done-background);
  color: var(--color-action-done-text);
}

.action-badge.is-pending-match {
  border-color: var(--color-action-pending-match-border);
  background: var(--color-action-pending-match-background);
  color: var(--color-action-pending-match-text);
  font-weight: 600;
}

.data-status-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}

.data-status-legend-key,
.data-status-legend-marks {
  display: inline-flex;
  flex-wrap: nowrap;
  align-items: center;
}

.data-status-legend-key {
  gap: 10px;
}

.data-status-legend-marks {
  gap: 16px;
}

.data-status-legend-source {
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.data-status-legend-split {
  width: 1px;
  height: 22px;
  flex: 0 0 auto;
  background: var(--color-foreground-line);
}

.data-status-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.customer-status-ring {
  display: inline-flex;
  width: 10px;
  height: 10px;
  flex: 0 0 10px;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: 2px solid currentColor;
  border-radius: 50%;
  background: transparent;
  color: var(--color-risk-neutral);
}

.customer-status-ring.is-status-confirmed {
  color: var(--color-state-success);
  background: currentColor;
  box-shadow: inset 0 0 0 2px var(--color-surface, var(--color-surface-glass));
}
.customer-status-ring.is-status-partial {
  color: var(--color-risk-info);
  border-style: dotted;
}
.customer-status-ring.is-status-pending {
  color: var(--color-risk-warning);
  border-style: dashed;
}
.customer-status-ring.is-status-error {
  color: var(--color-risk-critical);
  border-style: dotted;
  background: currentColor;
  box-shadow: inset 0 0 0 3px var(--color-surface, var(--color-surface-glass));
}
.customer-status-ring.is-status-conflict {
  color: var(--color-risk-critical);
  border: 3px double currentColor;
}
.customer-status-ring.is-status-unavailable {
  color: var(--color-risk-neutral);
  border-style: dashed;
}
.customer-status-ring.is-status-integrity {
  color: var(--color-risk-critical);
  background: currentColor;
}
.customer-status-ring.is-status-neutral { color: var(--color-risk-neutral); }

.actual-customer-value {
  display: flex !important;
  width: 100% !important;
  align-items: center;
  gap: 6px;
  min-width: 0;
  white-space: nowrap;
}

.actual-customer-value > .customer-status-ring,
.actual-customer-value > .source-hang-marks {
  margin-left: auto;
}

.source-hang-marks {
  display: inline-flex;
  align-items: flex-end;
  gap: 3px;
  flex: 0 0 auto;
}

.source-hang-slot {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.source-hang-slot-label {
  font-size: 9px;
  font-weight: 500;
  line-height: 1;
  color: var(--muted);
}

.source-hang-mark {
  display: inline-flex;
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  box-sizing: border-box;
  border: 2px solid currentColor;
  border-radius: 50%;
  background: transparent;
}

.source-hang-mark.is-hang-hung {
  color: var(--color-state-success);
  background: currentColor;
  box-shadow: inset 0 0 0 2px var(--color-surface, var(--color-surface-glass));
}

.source-hang-mark.is-hang-absent {
  color: var(--color-risk-neutral);
  background: transparent;
}

.source-hang-mark.is-hang-unassigned {
  color: var(--color-risk-warning);
  border-style: dashed;
}

.source-hang-mark.is-hang-stuck {
  color: var(--color-risk-critical);
  border-radius: 1px;
  background: currentColor;
}

.actual-customer-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.same-demand-tag {
  display: inline-flex;
  flex: 0 0 auto;
  min-height: 18px;
  align-items: center;
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-strong);
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

.action-badge-stack {
  display: inline-flex;
  align-items: center;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  max-width: 100%;
}

.action-badge-quantity {
  color: var(--color-text-muted);
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.action-badge-quantity.is-pull-in {
  color: var(--color-action-pull-in-text);
}

.action-badge-quantity.is-push-out {
  color: var(--color-action-push-out-text);
}

.action-badge-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  max-width: 100%;
}

.action-month-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 52px;
  padding: 3px 5px;
  border-radius: var(--radius-sm);
  line-height: 1.2;
  white-space: nowrap;
}

.action-month-chip.is-pull-in {
  background: var(--color-action-pull-in-background);
  color: var(--color-action-pull-in-text);
}

.action-month-chip.is-push-out {
  background: var(--color-action-push-out-background);
  color: var(--color-action-push-out-text);
}

.action-month-chip-label {
  font-size: 10px;
  font-weight: 700;
}

.action-month-chip-quantity {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  width: min(calc(100% - (var(--page-gutter) * 2)), var(--page-max));
  margin: 0 auto;
  padding: 0;
}


.panel-heading,
.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--glass);
  box-shadow: none;
  backdrop-filter: none;
  padding: 16px;
  border-bottom: 1px solid var(--line);
}

/* 已套用條件靠左，資料狀態控制與圖例靠右；空間不足時換行。 */
.table-heading-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 16px;
  min-width: 0;
}

.table-heading-meta .table-filter-toolbar {
  flex: 0 1 auto;
  min-width: 0;
}

.table-heading-meta .data-status-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  flex: 0 0 auto;
  margin-left: auto;
}

.table-heading-meta .data-status-legend {
  flex: 0 0 auto;
  margin-left: 0;
}

.table-heading-meta .data-status-toggle {
  height: 28px;
  min-height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1;
}

.table-heading-meta .toolbar-filter {
  width: auto;
  min-width: 112px;
}

.table-heading-meta .toolbar-filter .custom-select-trigger {
  min-height: 28px;
  padding: 0 9px 0 11px;
  border-color: var(--color-border-subtle);
  border-radius: var(--radius-pill);
  background: var(--color-palette-banana-cream-50);
  color: var(--color-brand-strong);
  font-size: 12px;
}

.table-heading-meta .toolbar-filter .custom-select-value.is-placeholder,
.table-heading-meta .toolbar-filter .custom-select-trigger > .icon {
  color: currentColor;
}

.table-filter-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

/* 清除篩選長在 chip 列裡，尺寸就跟著 .filter-chip 走；紅色沿用 .danger-button
   的語意。選擇器必須比後面的 .secondary-button/.danger-button 基底規則更具體，
   否則 min-height/padding 會被同權重但更晚出現的基底規則蓋回 42px。 */
.table-filter-toolbar .filter-clear-button {
  height: 28px;
  min-height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1;
}

.filter-clear-button .icon {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
}

.filter-clear-button span:not(.icon) {
  display: inline-flex;
  align-items: center;
  line-height: 1;
}

.page-tabs-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  position: relative;
  z-index: 40;
  margin-bottom: 16px;
}

.page-tabs {
  position: relative;
  display: inline-flex;
  flex: 0 1 auto;
  flex-wrap: nowrap;
  width: fit-content;
  min-width: 0;
  min-height: 40px;
  max-width: 100%;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  overflow-x: auto;
}

.page-tabs,
.fcst-status-strip {
  border: 0;
  border-radius: 0;
  background: transparent; /* ponytail: 一般模式狀態列不是資料夾本體；減少透明度改跟 --panel-fill。記號難讀再填實色 */
  box-shadow: none;
  backdrop-filter: none;
}

.page-tab {
  position: relative;
  z-index: 1;
  display: inline-flex;
  min-height: 40px;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 400;
  line-height: 1;
  padding: 0 16px;
  text-decoration: none;
  touch-action: manipulation;
  white-space: nowrap;
  transition: background-color var(--motion-fast) var(--motion-ease-out), color var(--motion-fast) var(--motion-ease-out);
}

.page-tab:active {
  transform: scale(0.97);
}

.page-tab:focus-visible {
  border-color: rgba(var(--brand-rgb), 0.52);
  color: var(--brand-strong);
  outline: 3px solid var(--color-state-focus-ring);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px rgba(var(--brand-rgb), 0.16);
}

.page-tab.is-active {
  background: transparent;
  box-shadow: none;
  color: var(--brand-strong);
}

.page-tabs-row .page-tab.is-active {
background: var(--glass);
  color: var(--ink);
  border: 0;
  border-radius: var(--radius-pill);
  box-shadow: none;
  font-weight: 500;
}

.page-tab-indicator {
  position: absolute;
  bottom: -1px;
  left: 0;
  z-index: 0;
  width: 0;
  height: 2px;
  border-radius: 0;
  background: var(--panel-fill, var(--color-surface-page));
  opacity: 1;
  pointer-events: none;
  transform: translateX(0);
  transition:
    transform var(--motion-fast) var(--motion-ease-out),
    width var(--motion-fast) var(--motion-ease-out);
  display: none;
}

.view-shell {
  --panel-fill: var(--color-surface-page);
  display: block;
  min-width: 0;
}

.view-shell:has(.page-tab.is-active[data-view="formula"]) {
  --panel-fill: var(--color-foreground-surface-panel-formula);
}

.view-shell:has(.page-tab.is-active[data-view="data-relations"]) {
  --panel-fill: var(--color-foreground-surface-panel-relations);
}

.view-shell:has(.page-tab.is-active[data-view="analytics"]) {
--panel-fill: var(--color-analytics-bg);
}

.view-shell:has(.page-tab.is-active[data-view="analytics"]) .view-panel {
  background-image: none;
  box-shadow: none;
  border-color: var(--color-analytics-grid);
}

.view-panel {
display: grid;
  gap: 16px;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

/* ponytail: 曾用 :has() 關兩頁點紋；授權三色底後改關面板內卡片 blur。standalone 關係頁不要關。卡片改不透明可刪。 */
.view-panel .formula-card,
.view-panel .data-relations-card {
  backdrop-filter: none;
}

.gmipo-calendar-page {
  display: grid;
  overflow: visible;
  gap: 20px;
  padding: 26px;
  border-color: var(--color-gmipo-calendar-line);
  background: var(--color-gmipo-calendar-surface);
  color: var(--color-gmipo-calendar-text);
  box-shadow: var(--shadow-glass);
  backdrop-filter: none;
}

.gmipo-calendar-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.gmipo-calendar-heading h2 {
  margin: 3px 0 8px;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.1;
}

.gmipo-calendar-heading p {
  max-width: 760px;
  margin: 0;
  color: var(--color-gmipo-calendar-text-muted);
  line-height: 1.65;
}

.gmipo-calendar-heading .eyebrow {
  color: var(--color-gmipo-calendar-accent);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.gmipo-calendar-toolbar,
.gmipo-calendar-filters,
.gmipo-calendar-mode-switch,
.gmipo-calendar-context,
.gmipo-calendar-selection,
.gmipo-calendar-legend {
  display: flex;
  align-items: center;
}

.gmipo-calendar-toolbar {
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 14px;
  padding: 14px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface-muted);
}

.gmipo-calendar-filters {
  flex-wrap: wrap;
  gap: 12px;
}

.gmipo-calendar-filters label {
  display: grid;
  gap: 6px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.gmipo-calendar-filters .chip-select {
  width: auto;
  min-width: 150px;
}

.gmipo-calendar-filters .chip-select .custom-select-trigger {
  min-width: 150px;
  min-height: 42px;
  border-color: var(--color-gmipo-calendar-line);
  background: var(--color-gmipo-calendar-surface);
  color: var(--color-gmipo-calendar-text);
}

.gmipo-calendar-filters .chip-select .custom-select-trigger:hover,
.gmipo-calendar-filters .chip-select.is-open .custom-select-trigger {
  background: var(--color-gmipo-calendar-surface-muted);
}

.gmipo-calendar-filters .chip-select .custom-select-trigger:focus-visible,
.gmipo-calendar-mode-switch button:focus-visible,
.gmipo-calendar-day:focus-visible,
.gmipo-month-navigation button:focus-visible {
  outline: 3px solid var(--color-gmipo-calendar-accent-strong);
  outline-offset: 2px;
}

.gmipo-calendar-mode-switch {
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: 999px;
  background: var(--color-gmipo-calendar-surface);
}

.gmipo-calendar-mode-switch button {
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.gmipo-calendar-mode-switch button.is-active {
  background: var(--color-gmipo-calendar-accent-strong);
  color: var(--color-gmipo-calendar-surface);
}

.gmipo-calendar-stats,
.gmipo-phase-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.gmipo-calendar-stat {
  display: grid;
  gap: 6px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface);
}

.gmipo-calendar-stat > span,
.gmipo-calendar-stat > small {
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.gmipo-calendar-stat > strong {
  overflow: hidden;
  font-size: clamp(20px, 2.5vw, 28px);
  font-variant-numeric: tabular-nums;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gmipo-calendar-context {
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
}

.gmipo-calendar-selection {
  flex-wrap: wrap;
  gap: 8px 14px;
  min-height: 30px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 13px;
  font-weight: 500;
}

.gmipo-calendar-selection strong {
  color: var(--color-gmipo-calendar-text);
}

.gmipo-calendar-selection-pill {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  padding: 0 10px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: 999px;
  background: var(--color-gmipo-calendar-surface-muted);
  color: var(--color-gmipo-calendar-text);
  font-variant-numeric: tabular-nums;
}

.gmipo-calendar-selection-pill.is-line {
  border-color: var(--color-gmipo-calendar-accent);
  background: var(--color-gmipo-calendar-accent-soft);
}

.gmipo-calendar-legend {
  gap: 6px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.gmipo-calendar-legend small {
  margin-left: 6px;
}

.gmipo-calendar-legend-swatch {
  width: 18px;
  height: 18px;
  border: 1px solid color-mix(in srgb, var(--color-gmipo-calendar-accent-strong) 12%, transparent);
  border-radius: 5px;
}

.gmipo-phase-view {
  display: grid;
  gap: 16px;
}

.gmipo-phase-matrix-scroll {
  overflow-x: auto;
  padding-bottom: 4px;
}

.gmipo-phase-matrix {
  width: 100%;
  min-width: 1180px;
  border-spacing: 3px;
  border-collapse: separate;
  table-layout: fixed;
}

.gmipo-phase-matrix th {
  height: 30px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 11px;
  font-weight: 500;
  text-align: center;
}

.gmipo-phase-matrix th:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 76px;
  background: var(--color-gmipo-calendar-surface);
}

.gmipo-phase-matrix tbody th {
  padding: 0 8px;
  text-align: center;
}

.gmipo-phase-matrix tbody th strong,
.gmipo-phase-matrix tbody th small {
  display: block;
}

.gmipo-phase-matrix tbody th small {
  margin-top: 2px;
  color: var(--color-gmipo-calendar-accent);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.gmipo-phase-matrix td {
  height: 28px;
  padding: 0;
}

.gmipo-phase-matrix td.is-outside {
  background: transparent;
}

.gmipo-phase-matrix td.is-weekend .gmipo-calendar-day {
  box-shadow: inset 0 0 0 2px var(--color-gmipo-calendar-accent);
}

.gmipo-calendar-day {
  display: grid;
  width: 100%;
  height: 100%;
  min-height: 28px;
  place-items: center;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--color-gmipo-calendar-accent-strong) 8%, transparent);
  border-radius: 5px;
  background: var(--color-gmipo-calendar-heat-empty);
  color: var(--color-gmipo-calendar-text);
  font-variant-numeric: tabular-nums;
}


.gmipo-calendar-day.is-selected {
  outline: 3px solid var(--color-gmipo-calendar-accent-strong);
  outline-offset: 1px;
  box-shadow: inset 0 0 0 2px var(--color-gmipo-calendar-surface);
}

.gmipo-calendar-year-view {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  gap: 18px;
}

.gmipo-month-navigation {
  position: sticky;
  top: 86px;
  display: grid;
  gap: 5px;
  padding: 12px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface-muted);
}

.gmipo-month-navigation > strong {
  padding: 4px 6px 8px;
}

.gmipo-month-navigation button {
  display: flex;
  min-height: 36px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.gmipo-month-navigation button strong {
  color: var(--color-gmipo-calendar-accent-strong);
  font-variant-numeric: tabular-nums;
}

.gmipo-month-calendar-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(240px, 1fr));
  gap: 14px;
}

.gmipo-month-calendar {
  scroll-margin-top: 86px;
  padding: 14px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface);
}

.gmipo-month-calendar header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.gmipo-month-calendar h3 {
  margin: 0;
  font-size: 16px;
}

.gmipo-month-calendar header strong {
  color: var(--color-gmipo-calendar-accent-strong);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.gmipo-calendar-weekdays,
.gmipo-mini-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.gmipo-calendar-weekdays {
  margin-bottom: 4px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 10px;
  font-weight: 500;
  text-align: center;
}

.gmipo-mini-calendar-grid {
  grid-auto-rows: 42px;
}

.gmipo-calendar-day.is-calendar-day {
  align-content: center;
  gap: 1px;
  min-height: 42px;
  font-size: 11px;
  font-weight: 500;
}

.gmipo-calendar-day.is-calendar-day small {
  overflow: hidden;
  width: 100%;
  padding: 0 2px;
  font-size: 8px;
  font-weight: 500;
  line-height: 1;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gmipo-calendar-blank {
  min-height: 42px;
}

.gmipo-calendar-empty {
  display: grid;
  gap: 8px;
  min-height: 220px;
  place-content: center;
  padding: 28px;
  border: 1px dashed var(--color-gmipo-calendar-line-strong);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface-muted);
  text-align: center;
}

.gmipo-calendar-empty strong {
  font-size: 22px;
}

.gmipo-calendar-empty p {
  max-width: 580px;
  margin: 0;
  color: var(--color-gmipo-calendar-text-muted);
  line-height: 1.7;
}

@media (hover: hover) and (pointer: fine) {
  .gmipo-month-navigation button:hover {
    border-color: var(--color-gmipo-calendar-line);
    background: var(--color-gmipo-calendar-surface);
    color: var(--color-gmipo-calendar-text);
  }
}

@media (max-width: 1200px) {
  .gmipo-month-calendar-grid {
    grid-template-columns: repeat(2, minmax(240px, 1fr));
  }
}

@media (max-width: 780px) {
  .gmipo-calendar-page {
    padding: 18px;
  }

  .gmipo-calendar-year-view {
    grid-template-columns: 1fr;
  }

  .gmipo-month-navigation {
    position: static;
    display: flex;
    overflow-x: auto;
    align-items: center;
  }

  .gmipo-month-navigation > strong,
  .gmipo-month-navigation button {
    flex: 0 0 auto;
  }

  .gmipo-month-navigation button {
    gap: 12px;
  }

  .gmipo-calendar-context {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 560px) {
  .gmipo-calendar-page {
    gap: 16px;
    padding: 14px;
  }

  .gmipo-calendar-toolbar,
  .gmipo-calendar-filters {
    align-items: stretch;
    flex-direction: column;
  }

  .gmipo-calendar-filters,
  .gmipo-calendar-filters label,
  .gmipo-calendar-filters .chip-select,
  .gmipo-calendar-filters .chip-select .custom-select-trigger,
  .gmipo-calendar-mode-switch {
    width: 100%;
  }

  .gmipo-calendar-mode-switch button {
    flex: 1 1 0;
  }

  .gmipo-calendar-stats,
  .gmipo-phase-summary,
  .gmipo-month-calendar-grid {
    grid-template-columns: 1fr;
  }

  .gmipo-calendar-legend {
    flex-wrap: wrap;
  }

  .gmipo-calendar-legend small {
    width: 100%;
    margin-left: 0;
  }
}

.supply-decision-page {
  display: grid;
  gap: 18px;
  padding: 24px;
  border-color: var(--color-gmipo-calendar-line);
  background: var(--color-gmipo-calendar-surface);
  color: var(--color-gmipo-calendar-text);
  box-shadow: var(--shadow-glass);
  backdrop-filter: none;
}

.supply-decision-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface-muted);
}

.supply-decision-toolbar label {
  display: grid;
  gap: 6px;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.supply-decision-toolbar .chip-select,
.supply-decision-toolbar .custom-select-trigger {
  width: 180px;
}

.supply-decision-toolbar .custom-select-trigger {
  min-height: 42px;
  border-color: var(--color-gmipo-calendar-line);
  background: var(--color-gmipo-calendar-surface);
  color: var(--color-gmipo-calendar-text);
}

.supply-decision-toolbar > p {
  margin: 0;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 12px;
  font-weight: 500;
}

.supply-decision-layout {
  display: grid;
  grid-template-columns: minmax(260px, 300px) minmax(520px, 1fr) minmax(320px, 370px);
  align-items: start;
  gap: 14px;
}

.supply-panel {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-md);
  background: var(--color-gmipo-calendar-surface);
}

.supply-panel-heading,
.supply-bridge-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.supply-panel-heading h3,
.supply-bridge-heading h3 {
  margin: 0;
  font-size: 16px;
}

.supply-panel-heading p,
.supply-bridge-heading p {
  margin: 4px 0 0;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.45;
}

.supply-count,
.supply-trust-total {
  flex: 0 0 auto;
  color: var(--color-gmipo-calendar-accent-strong);
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.supply-risk-list {
  display: grid;
  gap: 7px;
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
}

.supply-risk-button {
  display: grid;
  width: 100%;
  min-height: 62px;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 9px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--color-gmipo-calendar-surface-muted);
  color: var(--color-gmipo-calendar-text);
  text-align: left;
}

.supply-risk-button.is-selected {
  border-color: var(--color-gmipo-calendar-accent-strong);
  background: var(--color-gmipo-calendar-accent-soft);
}

.supply-risk-rank {
  color: var(--color-gmipo-calendar-accent);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.supply-risk-copy,
.supply-risk-metrics {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.supply-risk-copy strong,
.supply-risk-copy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.supply-risk-copy strong {
  font-size: 12px;
}

.supply-risk-copy small,
.supply-risk-metrics small {
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 9px;
  font-weight: 500;
}

.supply-risk-metrics {
  justify-items: end;
  font-variant-numeric: tabular-nums;
}

.supply-risk-metrics strong {
  color: var(--color-gmipo-calendar-accent-strong);
  font-size: 13px;
}

.supply-decision-aside {
  display: grid;
  min-width: 0;
  gap: 14px;
}

.supply-trust-rail {
  display: flex;
  overflow: hidden;
  height: 18px;
  margin-top: 14px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: 999px;
  background: var(--color-gmipo-calendar-heat-empty);
}


.supply-trust-legend {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.supply-trust-legend li {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr);
  gap: 2px 6px;
}

.supply-trust-legend li > span {
  grid-row: span 2;
  width: 8px;
  height: 8px;
  margin-top: 3px;
  border-radius: 999px;
}

.supply-trust-legend strong,
.supply-trust-legend small {
  font-size: 10px;
}

.supply-trust-legend small,
.supply-trust-note {
  color: var(--color-gmipo-calendar-text-muted);
}

.supply-trust-note {
  margin: 12px 0 0;
  font-size: 10px;
  font-weight: 500;
  line-height: 1.5;
}

.supply-heatmap-scroll,
.supply-variance-scroll,
.supply-bridge-scroll {
  overflow-x: auto;
}

.supply-heatmap {
  width: 100%;
  min-width: 300px;
  margin-top: 12px;
  border-spacing: 4px;
  border-collapse: separate;
}

.supply-heatmap th {
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 9px;
  font-weight: 500;
  text-align: center;
}

.supply-heatmap th:first-child {
  width: 104px;
  text-align: left;
}

.supply-heatmap tbody th strong,
.supply-heatmap tbody th small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.supply-heatmap tbody th strong { color: var(--color-gmipo-calendar-text); }
.supply-heatmap tbody th small { margin-top: 2px; font-size: 8px; }

.supply-heatmap td {
  width: 46px;
  height: 36px;
  padding: 0;
}

.supply-heatmap button {
  width: 100%;
  height: 100%;
  min-height: 34px;
  padding: 0 2px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: 6px;
  color: var(--color-gmipo-calendar-text);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.1;
}


.supply-heatmap button.is-selected { outline: 3px solid var(--color-analytics-hero); outline-offset: 1px; }

.supply-bridge-panel {
  display: grid;
  gap: 16px;
}

.supply-bridge-heading {
  flex-wrap: wrap;
}

.supply-bridge-heading .eyebrow {
  margin: 0 0 4px;
  color: var(--color-gmipo-calendar-accent);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.supply-period-switch {
  display: flex;
  max-width: 100%;
  overflow-x: auto;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: 999px;
  background: var(--color-gmipo-calendar-surface-muted);
}

.supply-period-switch button {
  flex: 0 0 auto;
  min-height: 30px;
  padding: 0 9px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 10px;
  font-weight: 500;
}

.supply-period-switch button.is-selected {
  background: var(--color-gmipo-calendar-accent-strong);
  color: var(--color-gmipo-calendar-surface);
}

.supply-bridge {
  display: grid;
  min-width: 660px;
  grid-template-columns: repeat(5, minmax(110px, 1fr));
  gap: 8px;
}

.supply-bridge-step {
  display: grid;
  min-height: 108px;
  align-content: center;
  gap: 7px;
  padding: 12px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-sm);
  background: var(--color-gmipo-calendar-surface-muted);
}

.supply-bridge-step.is-result {
  border-color: var(--color-gmipo-calendar-accent-strong);
  background: var(--color-gmipo-calendar-accent-soft);
}

.supply-bridge-sign {
  color: var(--color-gmipo-calendar-accent);
  font-size: 11px;
  font-weight: 500;
}

.supply-bridge-step small {
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 10px;
  font-weight: 500;
}

.supply-bridge-step strong {
  overflow: hidden;
  font-size: clamp(17px, 2vw, 23px);
  font-variant-numeric: tabular-nums;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.supply-bridge-action {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  gap: 8px 12px;
  padding: 10px 12px;
  border: 1px solid var(--color-gmipo-calendar-line);
  border-radius: var(--radius-sm);
  background: var(--color-gmipo-calendar-surface-muted);
  font-size: 11px;
}

.supply-bridge-action span,
.supply-bridge-action small { color: var(--color-gmipo-calendar-text-muted); }
.supply-bridge-action strong { color: var(--color-gmipo-calendar-accent-strong); }

.supply-bridge-blocked,
.supply-empty {
  display: grid;
  min-height: 148px;
  place-content: center;
  gap: 6px;
  padding: 18px;
  border: 1px dashed var(--color-gmipo-calendar-accent);
  border-radius: var(--radius-sm);
  background: var(--color-gmipo-calendar-accent-soft);
  text-align: center;
}

.supply-bridge-blocked p,
.supply-empty p,
.supply-empty-inline {
  margin: 0;
  color: var(--color-gmipo-calendar-text-muted);
  font-size: 11px;
  line-height: 1.5;
}

.supply-variance {
  display: grid;
  gap: 10px;
  padding-top: 2px;
}

.supply-variance-table {
  width: 100%;
  min-width: 680px;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.supply-variance-table th,
.supply-variance-table td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--color-gmipo-calendar-line);
  font-size: 10px;
  text-align: right;
}

.supply-variance-table th:first-child { text-align: left; }
.supply-variance-table thead th { color: var(--color-gmipo-calendar-text-muted); font-weight: 500; }
.supply-variance-table tbody tr.is-selected { background: var(--color-gmipo-calendar-accent-soft); }

.supply-variance-table tbody th button {
  padding: 4px 6px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--color-gmipo-calendar-text);
  font-size: 10px;
  font-weight: 500;
}

.supply-variance-table tbody th button.is-selected {
  background: var(--color-gmipo-calendar-accent-strong);
  color: var(--color-gmipo-calendar-surface);
}

.supply-difference {
  display: inline-flex;
  min-width: 58px;
  justify-content: flex-end;
  font-weight: 500;
}

.supply-difference.is-positive { color: var(--color-gmipo-calendar-accent-strong); }
.supply-difference.is-negative { color: var(--color-gmipo-calendar-accent); }
.supply-difference.is-zero,
.supply-difference.is-empty { color: var(--color-gmipo-calendar-text-muted); }

.supply-risk-button:focus-visible,
.supply-heatmap button:focus-visible,
.supply-period-switch button:focus-visible,
.supply-variance-table button:focus-visible,
.supply-decision-toolbar .custom-select-trigger:focus-visible {
  outline: 3px solid var(--color-gmipo-calendar-accent-strong);
  outline-offset: 2px;
}

@media (hover: hover) and (pointer: fine) {
  .supply-risk-button:hover { border-color: var(--color-gmipo-calendar-accent); }
  .supply-heatmap button:hover { border-color: var(--color-gmipo-calendar-accent-strong); }
}

@media (max-width: 1320px) {
  .supply-decision-layout {
    grid-template-columns: minmax(250px, 300px) minmax(0, 1fr);
  }

  .supply-decision-aside {
    grid-column: 1 / -1;
    grid-template-columns: minmax(280px, 0.8fr) minmax(440px, 1.2fr);
  }
}

@media (max-width: 900px) {
  .supply-decision-layout,
  .supply-decision-aside {
    grid-template-columns: 1fr;
  }

  .supply-decision-aside { grid-column: auto; }
}

@media (max-width: 560px) {
  .supply-decision-page { gap: 14px; padding: 14px; }
  .supply-decision-toolbar { align-items: stretch; flex-direction: column; }
  .supply-decision-toolbar .chip-select,
  .supply-decision-toolbar .custom-select-trigger { width: 100%; }
  .supply-panel { padding: 13px; }
  .supply-risk-button { grid-template-columns: 24px minmax(0, 1fr); }
  .supply-risk-metrics { grid-column: 2; justify-items: start; }
  .supply-bridge-action { grid-template-columns: 1fr; }
  .supply-trust-legend { grid-template-columns: 1fr; }
}

.fcst-status-strip {
  display: flex;
  min-width: 0;
  min-height: 0;
  max-width: 100%;
  align-items: center;
  align-content: center;
  flex: 1 1 auto;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px 12px;
  margin-left: auto;
  padding: 0 8px 0 16px;
}

.fcst-status-strip.is-loading,
.fcst-status-strip.is-error {
  flex: 0 1 auto;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.fcst-status-strip.is-error {
  color: var(--red);
}

.fcst-status-chip {
  position: relative;
  display: inline-flex;
  min-height: 24px;
  max-width: none;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 11px;
  font-weight: 850;
  line-height: 1;
  padding: 0;
  white-space: nowrap;
}

.fcst-status-chip::before {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  box-sizing: border-box;
  border-radius: 999px;
  content: "";
}

.fcst-status-chip.is-current-month {
  background: transparent;
  color: var(--color-text-primary);
}

.fcst-status-chip.is-current-month::before {
  background: var(--color-state-success);
}

.fcst-status-chip.is-not-current-month {
  background: transparent;
  color: var(--color-text-secondary);
}

.fcst-status-chip.is-not-current-month::before {
  background: var(--color-risk-warning);
  box-shadow: 0 0 0 1.5px var(--bg, var(--color-surface-page)), 0 0 0 3px var(--color-risk-warning);
}

.fcst-status-chip.is-not-uploaded {
  background: transparent;
  color: var(--color-text-muted);
}

.fcst-status-chip.is-not-uploaded::before {
  border: 2px solid var(--color-risk-neutral);
  background: transparent;
}

.fcst-status-chip-tooltip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  z-index: 2;
  max-width: 240px;
  padding: 8px 12px;
  border-radius: var(--radius-xs);
  background: var(--glass-strong);
  color: var(--ink);
  box-shadow: var(--shadow-glass);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.45;
  white-space: pre-line;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 0) scale(0.98);
  transform-origin: 50% 100%;
  transition:
    opacity var(--motion-fast) var(--motion-ease-out),
    transform var(--motion-fast) var(--motion-ease-out);
}

.fcst-status-chip:hover .fcst-status-chip-tooltip,
.fcst-status-chip:focus-visible .fcst-status-chip-tooltip {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
  transition-delay: 80ms;
}

.data-relations-card {
  display: grid;
  gap: 18px;
  padding: 20px;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.data-relations-archify-frame {
  display: block;
  width: 100%;
  height: calc(100vh - 250px);
  min-height: 720px;
  border: 0;
}

.architecture-archify-page {
  grid-template-rows: auto minmax(0, 1fr);
}

.architecture-archify-page .data-relations-archify-frame {
  height: calc(100vh - 280px);

  background: var(--lieflat-bg);
}

.data-relations-heading {
  align-items: flex-start;
  margin-bottom: 0;
}

.data-relations-heading h2 {
  margin: 0;
}

.data-relations-heading p {

  font-size: 13px;

}

.data-relations-mode-switch {

}

.data-relations-intro {

.data-relations-intro .eyebrow {

.data-relations-intro strong {

.data-relations-direction {

.data-relations-legend {

  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  margin-right: 0;

.data-relations-legend-item {
  flex: 0 0 auto;

  align-items: center;

  border: 1px solid var(--color-foreground-line);

.data-relations-legend-item i {

.data-relations-layout {

.data-relations-canvas-wrap {

.data-relations-canvas-wrap::before {

.data-relations-detail {

.data-relations-detail-kicker {

.data-relations-detail h3 {

  font-size: 22px;

}

.data-relations-detail p {

  font-size: 13px;
  font-weight: 500;
  line-height: 1.55;
}

.data-relations-relation-list {

  margin: 0;
  padding: 0;

}

.data-relations-relation-list li {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 2px 8px;
  border: 1px solid var(--color-foreground-line);

.data-relations-relation-list span {

.data-relations-relation-list strong {

  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
