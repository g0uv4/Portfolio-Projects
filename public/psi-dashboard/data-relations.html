.data-relations-relation-list small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.35;
  overflow-wrap: anywhere;
  white-space: normal;
}

.formula-card {
  display: grid;
  gap: 16px;
  padding: 18px;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.formula-visual-page {
  gap: 18px;
}

.formula-heading {
  display: flex;
  align-items: center;
  gap: 12px;
}

.formula-heading h2 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 500;
  line-height: 1.15;
}

.formula-heading p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
}

.formula-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.formula-item {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-glass);
}

.formula-item h3 {
  margin: 0 0 8px;
  color: var(--brand-strong);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.2;
}

.formula-item ul {
  display: grid;
  gap: 6px;
  margin: 0;
  padding-left: 17px;
}

.formula-item li {
  color: var(--color-text-secondary);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.45;
}

.formula-flow-card-heading,
.formula-full-details summary {
  display: flex;
  align-items: center;
  gap: 12px;
}

.formula-flow-card h3 {
  margin: 0;
  color: var(--ink);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0;
}

.formula-chip-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.formula-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 6px 10px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-pill);
  background: var(--color-surface-glass);
  color: var(--ink);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.15;
  white-space: normal;
}

.formula-core-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.formula-flow-card {
  display: grid;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-glass);
  outline: none;
}

.formula-flow-card:hover {
  border-color: var(--color-border-strong);
  background: var(--glass-hover);
}

.formula-flow-steps {
  display: grid;
  gap: 10px;
}

.formula-flow-step {
  display: grid;
  gap: 6px;
}

.formula-flow-step-main code {
  display: block;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--color-text-primary) 6%, transparent);
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  white-space: normal;
  word-break: break-word;
}

.formula-step-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.formula-step-label-impact {
  font-weight: var(--typography-weight-strong);
}

.formula-step-impact-text {
  font-weight: var(--typography-weight-strong);
}

.formula-flow-step p,
.formula-flow-step strong {
  margin: 0;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.45;
}

.formula-full-details {
  padding: 14px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-glass);
}

.formula-full-details summary {
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  list-style: none;
}

.formula-full-details summary::-webkit-details-marker {
  display: none;
}

.formula-decision-section {
  display: grid;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-glass);
}

.formula-decision-heading {
  display: flex;
  align-items: center;
  gap: 12px;
}

.formula-decision-heading h3,
.formula-decision-heading p,
.formula-decision-detail h3,
.formula-decision-detail h4,
.formula-decision-detail p {
  margin: 0;
}

.formula-decision-heading h3 {
  color: var(--ink);
  font-size: 17px;
  font-weight: 500;
}

.formula-decision-heading p {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.45;
}

.formula-decision-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 320px);
  gap: 16px;
  align-items: start;
}

.formula-tree-pane {
  min-width: 0;
  overflow-x: auto;
  padding: 2px;
}

.formula-tree-root {
  position: relative;
  display: flex;
  justify-content: center;
  padding-bottom: 22px;
}

.formula-tree-root::after {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 1px;
  height: 18px;
  background: var(--color-foreground-line-strong);
  content: "";
}

.formula-tree-lead {
  position: relative;
  display: grid;
  justify-items: center;
  max-width: 420px;
  margin: 0 auto;
  padding-bottom: 22px;
}

.formula-tree-lead::after {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 1px;
  height: 18px;
  background: var(--color-foreground-line-strong);
  content: "";
}

.formula-tree-lead .formula-tree-path {
  width: 100%;
}

.formula-tree-lead .formula-tree-node.is-root {
  width: 100%;
  max-width: none;
}

.formula-tree-columns {
  display: grid;
  min-width: 780px;
  grid-template-columns: repeat(3, minmax(240px, 1fr));
  gap: 12px;
  align-items: start;
}

.formula-tree-branch {
  position: relative;
  min-width: 0;
  padding: 14px 10px 0;
  border-top: 1px solid var(--color-foreground-line-strong);
}

.formula-tree-branch::before {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 12px;
  background: var(--color-foreground-line-strong);
  content: "";
}

.formula-tree-path,
.formula-tree-children {
  margin: 0;
  padding: 0;
  list-style: none;
}

.formula-tree-path {
  margin-top: 10px;
}

.formula-tree-item {
  min-width: 0;
}

.formula-tree-children {
  display: grid;
  gap: 8px;
  margin: 8px 0 0 14px;
  padding-left: 12px;
  border-left: 1px solid var(--color-foreground-line);
}

.formula-tree-edge {
  position: relative;
  display: grid;
  min-width: 0;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 6px;
  align-items: start;
}

.formula-tree-edge::before {
  position: absolute;
  top: 13px;
  left: -12px;
  width: 12px;
  height: 1px;
  background: var(--color-foreground-line);
  content: "";
}

.formula-tree-answer {
  display: inline-flex;
  min-width: 24px;
  height: 24px;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-pill);
  background: var(--color-foreground-surface-control);
  color: var(--color-text-secondary);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

.formula-tree-node {
  display: grid;
  width: 100%;
  min-width: 0;
  min-height: 48px;
  gap: 3px;
  align-content: center;
  padding: 9px 10px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-sm);
  background: var(--color-foreground-surface-control);
  color: var(--ink);
  text-align: left;
  box-shadow: none;
  cursor: pointer;
}

.formula-tree-node:hover {
  border-color: var(--color-border-strong);
  background: var(--color-foreground-surface-data-hover);
}

.formula-tree-node:focus-visible,
.formula-tree-node.is-selected {
  border-color: var(--color-state-focus-ring);
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.formula-tree-node strong {
  color: inherit;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.35;
}

.formula-tree-node small {
  color: inherit;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.35;
  opacity: 0.76;
}

.formula-tree-node.is-root {
  width: min(100%, 320px);
  min-height: 52px;
  border-color: var(--color-brand-base);
  background: var(--brand-soft);
  color: var(--brand-strong);
  text-align: center;
}

.formula-tree-node.is-scenario {
  position: relative;
  min-height: 58px;
  background: var(--color-foreground-surface-strong);
  text-align: center;
}

.formula-tree-node.is-join {
  border-color: var(--color-brand-base);
  background: var(--brand-soft);
  color: var(--brand-strong);
}

.continue-caption {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  text-align: center;
}

.formula-tree-join {
  position: relative;
  margin-top: 8px;
  padding-top: 18px;
  border-top: 1px solid var(--color-foreground-line-strong);
}

.formula-tree-join::before {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 14px;
  background: var(--color-foreground-line-strong);
  content: "";
}

.join-kicker {
  margin: 0 0 10px;
  color: var(--brand-strong);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

.join-lead,
.join-sequence {
  display: grid;
  gap: 8px;
  max-width: 520px;
  margin: 0 auto;
  justify-items: stretch;
}

.join-split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  max-width: 760px;
  margin: 12px auto;
}

.join-split-col {
  min-width: 0;
  padding: 10px 8px 0;
  border-top: 1px solid var(--color-foreground-line);
}

.formula-tree-node.is-action-pull-in {
  border-color: var(--color-action-pull-in-border);
  background: var(--color-action-pull-in-background);
  color: var(--color-action-pull-in-text);
}

.formula-tree-node.is-action-borrow {
  border-color: var(--color-action-borrow-border);
  background: var(--color-action-borrow-background);
  color: var(--color-action-borrow-text);
}

.formula-tree-node.is-action-push-out {
  border-color: var(--color-action-push-out-border);
  background: var(--color-action-push-out-background);
  color: var(--color-action-push-out-text);
}

.formula-tree-node.is-action-purchase {
  border-color: var(--color-action-purchase-border);
  background: var(--color-action-purchase-background);
  color: var(--color-action-purchase-text);
}

.formula-tree-node.is-terminal {
  border-color: var(--color-action-done-border);
  background: var(--color-action-done-background);
  color: var(--color-action-done-text);
}

.formula-decision-detail {
  position: sticky;
  top: 16px;
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  background: var(--color-foreground-surface-data);
}

.formula-decision-detail h3 {
  color: var(--ink);
  font-size: 17px;
  font-weight: 500;
}

.formula-decision-detail-section {
  display: grid;
  gap: 4px;
}

.formula-decision-detail-section h4 {
  color: var(--brand-strong);
  font-size: 12px;
  font-weight: 500;
}

.formula-decision-detail-section p,
.formula-decision-detail-section code {
  color: var(--color-text-secondary);
  font-family: var(--typography-family-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
}

.formula-decision-detail-section code {
  display: block;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--color-text-primary) 6%, transparent);
  white-space: pre-wrap;
  font-variant-numeric: tabular-nums;
  word-break: break-word;
}

.detail-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.formula-nav-button {
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-pill);
  background: var(--color-foreground-surface-panel-formula);
  color: var(--brand-strong);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

.formula-nav-button:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.formula-badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}

.formula-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 2px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-pill);
  background: var(--color-foreground-surface-panel-formula);
  color: var(--brand-strong);
  font-size: 11px;
  font-weight: 500;
}

.formula-badge-warning {
  border-color: var(--color-action-push-out-border);
  background: var(--color-action-push-out-background);
  color: var(--color-action-push-out-text);
}

.formula-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.formula-legend-item {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 500;
}

.formula-legend-item.is-pull-in {
  color: var(--color-action-pull-in-text);
  background: var(--color-action-pull-in-background);
  border: 1px solid var(--color-action-pull-in-border);
}

.formula-legend-item.is-borrow {
  color: var(--color-action-borrow-text);
  background: var(--color-action-borrow-background);
  border: 1px solid var(--color-action-borrow-border);
}

.formula-legend-item.is-purchase {
  color: var(--color-action-purchase-text);
  background: var(--color-action-purchase-background);
  border: 1px solid var(--color-action-purchase-border);
}

.formula-legend-item.is-push-out {
  color: var(--color-action-push-out-text);
  background: var(--color-action-push-out-background);
  border: 1px solid var(--color-action-push-out-border);
}

.formula-card.formula-visual-page :not(h2, h3, h4, summary) {
  font-family: var(--typography-family-sans);
}

.formula-visual-page .formula-heading p,
.formula-visual-page .formula-chip,
.formula-visual-page .formula-item li,
.formula-visual-page .formula-flow-step-main code,
.formula-visual-page .formula-step-label,
.formula-visual-page .formula-flow-step p,
.formula-visual-page .formula-flow-step strong {
  font-size: 12px;
  font-weight: 500;
}

.formula-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.search-shell,
.select-shell {
  position: relative;
  display: flex;
  min-width: 0;
  align-items: center;
}

.search-shell .icon {
  position: absolute;
  left: 13px;
  z-index: 1;
  color: var(--brand);
}

.control-input,
.edit-input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--glass);
  color: var(--ink);
  font-weight: 400;
  outline: none;
  transition: border-color var(--motion-fast) var(--motion-ease-out), background-color var(--motion-fast) var(--motion-ease-out);
}

.control-input {
  padding: 0 14px 0 42px;
}

.control-input:focus,
.edit-input:focus {
  border-color: var(--brand);
  background: var(--glass);
  box-shadow: none;
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.custom-select {
  position: relative;
  width: 100%;
  min-width: 0;
}

.custom-select-trigger {
  display: flex;
  width: 100%;
  min-height: 44px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 11px 0 13px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--glass);
  color: var(--ink);
  font-weight: 400;
  text-align: left;
  outline: none;
  box-shadow: none;
  transition: background-color var(--motion-fast) var(--motion-ease-out), color var(--motion-fast) var(--motion-ease-out);
}

.custom-select-trigger:active {
  transform: scale(0.98);
}

.custom-select-trigger:focus-visible,
.custom-select.is-open .custom-select-trigger {
  border-color: rgba(var(--brand-rgb), 0.62);
  background: var(--glass);
  box-shadow: none;
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

.custom-select-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.custom-select-value.is-placeholder {
  color: var(--muted);
}

.custom-select-trigger > .icon {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--brand);
  transition: transform var(--motion-fast) var(--motion-ease-out);
}

.custom-select.is-open .custom-select-trigger > .icon {
  transform: rotate(180deg);
}

.custom-select-panel {
  position: fixed;
  z-index: 1000;
  display: grid;
  gap: 8px;
  max-height: min(390px, calc(100vh - 24px));
  padding: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--glass);
  box-shadow: var(--shadow-lift);
  backdrop-filter: none;
  transform-origin: var(--dropdown-origin-x, 50%) var(--dropdown-origin-y, top);
  transform: scale(0.97);
  opacity: 0;
  pointer-events: none;
  transition:
    transform var(--motion-fast) var(--motion-ease-out),
    opacity var(--motion-fast) var(--motion-ease-out);
  will-change: transform, opacity;
}

.custom-select-panel.is-open {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

.custom-select-panel.is-closing {
  transform: scale(0.99);
  opacity: 0;
  pointer-events: none;
}

.custom-select-search-shell {
  position: relative;
  display: flex;
  align-items: center;
}

.custom-select-search-shell .icon {
  position: absolute;
  left: 11px;
  z-index: 1;
  width: 16px;
  height: 16px;
  color: var(--brand);
  pointer-events: none;
}

.custom-select-search {
  width: 100%;
  min-height: 38px;
  padding: 0 11px 0 35px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--glass);
  color: var(--ink);
  font-weight: 500;
  outline: none;
}

.custom-select-search:focus {
  border-color: rgba(var(--brand-rgb), 0.56);
  box-shadow: 0 0 0 3px rgba(var(--brand-rgb), 0.12);
}

.custom-select-options {
  display: grid;
  gap: 3px;
  max-height: 280px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(var(--brand-rgb), 0.32) transparent;
}

.custom-select-option {
  display: flex;
  width: 100%;
  min-height: 38px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 9px 7px 11px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-text-secondary);
  font-weight: 500;
  text-align: left;
  transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
}

.custom-select-option:hover,
.custom-select-option.is-highlighted {
  border-color: rgba(var(--brand-rgb), 0.12);
  background: rgba(var(--brand-rgb), 0.09);
  color: var(--brand-strong);
}

.custom-select-option.is-selected {
  border-color: rgba(var(--brand-rgb), 0.2);
  background: var(--brand-soft);
  color: var(--brand-strong);
}

.custom-select-option-copy {
  min-width: 0;
  flex: 1;
  display: grid;
  gap: 1px;
}

.custom-select-option-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-filter-panel .custom-select-option {
  justify-content: flex-start;
  font-size: var(--typography-table-body-size);
  font-weight: var(--typography-table-body-weight);
  line-height: var(--typography-table-body-line-height);
  text-align: left;
}

.header-filter-panel .custom-select-option-label {
  flex: 1 1 auto;
  text-align: left;
}

.custom-select-option-hint {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--color-text-muted);
  font-size: var(--typography-form-label-size);
  font-weight: var(--typography-form-label-weight);
  line-height: var(--typography-form-label-line-height);
}

.custom-select-option .icon,
.custom-select-option-spacer {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
}

.custom-select-option .icon {
  color: var(--brand);
}

.custom-select-empty {
  padding: 18px 12px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

.chip-select {
  width: 100%;
  min-width: 0;
}

.chip-select .custom-select-trigger {
  width: auto;
  max-width: 100%;
  min-height: 36px;
  padding: 0 12px 0 14px;
  border-radius: var(--radius-pill);
  background: var(--color-palette-banana-cream-50);
  box-shadow: none;
}

.chip-select .custom-select-trigger:hover,
.chip-select.is-open .custom-select-trigger {
  background: var(--color-surface-glass-hover);
}

.chip-select .custom-select-trigger:focus-visible {
  outline: 3px solid var(--color-state-focus-ring);
  outline-offset: 2px;
}

}

.dashboard-table .frozen-actual-ship-customer > span {

.dashboard-table .frozen-actual-ship-customer .actual-customer-value {

.dashboard-table th,
.dashboard-table td {
  padding: var(--space-table-cell-y) var(--space-table-cell-x);
  border-right: 1px solid transparent;
  border-bottom: 1px solid transparent;
  vertical-align: middle;
  background: var(--glass);
  font-weight: 400;
}

.dashboard-table th {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--color-surface-table-header);
  color: var(--ink);
  font-weight: 500;
  text-align: center;
  white-space: normal;
  backdrop-filter: none;
}

/* 凍結表頭必須高於一般 base-header（z-index:12）與月份副標（11），避免向左捲動時被蓋住。 */
.dashboard-table thead .frozen-column,
.dashboard-table .month-group-row th.frozen-column,
.dashboard-table .month-group-row .base-header.frozen-column {

}

.dashboard-table .month-group-row th {

  font-size: 12px;
  letter-spacing: 0;
}

/* 月份使用相鄰暖色表面，保持深字與閱讀連續性。
   上排月份帶與該月副標列同色；前 8 欄基礎欄維持 table-header。 */
.dashboard-table .month-group-header.month-offset-0,
.dashboard-table .month-group-header.month-offset-2,
.dashboard-table .month-group-header.month-offset-4,
.dashboard-table .month-subheader-row th.month-offset-0,
.dashboard-table .month-subheader-row th.month-offset-2,
.dashboard-table .month-subheader-row th.month-offset-4 {
  background: var(--color-surface-table-header-month-dark);
}
.dashboard-table .month-group-header.month-offset-1,
.dashboard-table .month-group-header.month-offset-3,
.dashboard-table .month-group-header.month-offset-5,
.dashboard-table .month-subheader-row th.month-offset-1,
.dashboard-table .month-subheader-row th.month-offset-3,
.dashboard-table .month-subheader-row th.month-offset-5 {
  background: var(--color-surface-table-header-month-light);
}

.dashboard-table .month-subheader-row th {
  top: calc(var(--table-toolbar-offset, 76px) + 30px);
  z-index: 11;
  height: 38px;
  min-height: 38px;
  padding-top: 4px;
  padding-bottom: 4px;
  background: var(--color-surface-table-header);
  color: var(--ink);
  font-size: 12px;
}

.dashboard-table .table-horizontal-scrollbar-spacer th {
  position: static;
  height: var(--table-horizontal-scrollbar-height);
  padding: 0;
  border: 0;
  background: var(--glass-strong);
}

.dashboard-table th.is-resizable-column {
  position: sticky;
  overflow: visible;
  padding-right: 12px;
}

.dashboard-table .column-resize-handle {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 2;
  width: 10px;
  height: 100%;
  cursor: col-resize;
  touch-action: none;
  user-select: none;
}

.dashboard-table .column-resize-handle::after {
  content: "";
  position: absolute;
  top: 20%;
  bottom: 20%;
  left: 4px;
  width: 2px;
  border-radius: 999px;
  background: var(--line-strong);
  opacity: 1;
  transition: opacity 120ms ease, background-color 120ms ease;
}

.dashboard-table .column-resize-handle:hover::after,
.dashboard-table .column-resize-handle:focus-visible::after,
body.is-column-resizing .dashboard-table .column-resize-handle::after {
  opacity: 1;
  background: var(--brand);
}

.dashboard-table .column-resize-handle:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: -2px;
}

body.is-column-resizing {
  cursor: col-resize !important;
  user-select: none !important;
}

body.is-column-resizing .sort-header-button {
  pointer-events: none;
}

.sort-header-button {
  display: inline-flex;
  width: 100%;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  line-height: 1.15;
  white-space: normal;
}

.sort-header-button:focus-visible {
  outline: 2px solid var(--color-state-focus-ring);
  outline-offset: 3px;
  border-radius: 10px;
}

.sort-header-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: visible;
  text-align: center;
  white-space: normal;
  overflow-wrap: break-word;
}

.sort-indicator {
  display: inline-flex;
  width: 13px;
  height: 13px;
  flex: 0 0 13px;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  opacity: 0.66;
}

.sort-indicator.is-active {
  color: var(--ink);
  opacity: 1;
}

.sort-indicator .icon {
  width: 13px;
  height: 13px;
}

.dashboard-table .month-group-row .base-header {
  z-index: 12;
  color: var(--ink);
  background: var(--color-surface-table-header);
  vertical-align: middle;
}

.dashboard-table .month-group-row .base-header.frozen-column {
  z-index: 16;
}

/* 表頭欄名即篩選入口；排序維持同列的獨立按鈕，下拉面板仍掛 body fixed。 */
.dashboard-table th.has-header-filter {
  vertical-align: middle;
}

.dashboard-table th.has-header-filter:not(.is-resizable-column) {
  padding-right: 6px;
  padding-left: 6px;
}

.header-control-row {
  display: flex;
  width: 100%;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.header-control-row .custom-select {
  width: auto;
  min-width: 0;
  flex: 1 1 auto;
}

.header-control-row .sort-header-button.is-icon-only {
  width: 22px;
  min-width: 22px;
  height: 28px;
  flex: 0 0 22px;
  border-radius: 7px;
}

.header-filter .custom-select-trigger {
  min-height: 32px;
  gap: 2px;
  padding: 1px 4px;
  border-color: transparent;
  border-radius: var(--radius-sm);
  background: var(--glass);
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
  box-shadow: none;
}

.header-filter .custom-select-state {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.header-filter .custom-select-value.is-placeholder {
  color: var(--ink);
}

.header-filter .custom-select-trigger > .icon {
  width: 10px;
  height: 10px;
  color: var(--ink);
}

.header-filter .custom-select-trigger:focus-visible,
.header-filter.is-open .custom-select-trigger,
.header-filter.has-value .custom-select-trigger {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--ink);
}

.header-filter .custom-select-trigger:focus-visible > .icon,
.header-filter.is-open .custom-select-trigger > .icon,
.header-filter.has-value .custom-select-trigger > .icon {
  color: var(--brand-strong);
}

.dashboard-table .month-group-header,
.dashboard-table .month-start-cell {
  border-left: 0;
}

.dashboard-table .month-group-header,
.dashboard-table .month-end-cell {
  border-right: 1px solid var(--line);
}

.dashboard-table td {
  color: var(--color-text-secondary);
  white-space: nowrap;
}

.dashboard-table tbody tr {
  cursor: pointer;
}

.dashboard-table tbody tr:not(.virtual-spacer-row) {
  height: var(--space-compact-row-height);
}

.dashboard-table .virtual-spacer-row {
  cursor: default;
}

.dashboard-table .virtual-spacer-row td {
  padding: 0;
  border: 0;
  background: transparent;
  pointer-events: none;
}

.dashboard-table tbody tr:hover td {
  background: var(--glass);
}

.dashboard-table tbody tr.selected-row td {
  background: var(--glass);
}

.dashboard-table tbody tr.selected-row.dirty-row td {
  background: var(--glass);
}

.dashboard-table tbody tr:hover td.frozen-column {
  background: var(--glass);
}

.dashboard-table tbody tr.selected-row td.frozen-column {
  background: var(--glass);
}

.dashboard-table tbody tr.selected-row.dirty-row td.frozen-column {
  background: var(--glass);
}

.dashboard-table tbody tr.dirty-row td:first-child {
  box-shadow: inset 4px 0 0 var(--color-state-edited);
}

.dashboard-table tbody tr.is-save-error td {
  outline: 2px solid var(--color-risk-critical);
  outline-offset: -2px;
}

.numeric-cell {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.action-cell {
  text-align: center;
}

.product-line-cell {
  text-align: center;
}

.product-line-value {
  display: inline-flex;
  min-width: 0;
  max-width: 100%;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-line-value[data-line="CM"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value[data-line="CN"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value[data-line="MM"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value[data-line="PC"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value[data-line="SI"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value[data-line="Raymx"] {
color: var(--ink);
  border: 0;
  background: transparent;
}

.product-line-value.is-unknown {
  border-color: var(--color-foreground-line);
  background: transparent;
  color: var(--muted);
  border: 0;
}

.part-cell {
  min-width: 180px;
}

.part-cell-content {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  vertical-align: middle;
  white-space: nowrap;
}

.part-number-value {
  min-width: 0;
  white-space: nowrap;
}

.customer-match-warning-badge {
  display: inline-flex;
  min-height: 20px;
  align-items: center;
  padding: 3px 7px;
  border: 1px solid var(--color-state-warning);
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--color-state-warning) 12%, transparent);
  color: var(--color-text-primary);
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

.overridden-cell {
  background: rgba(var(--brand-rgb), 0.1) !important;
  color: var(--brand-strong);
  font-weight: 500;
}

.overridden-cell small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
}

.empty-cell {
  padding: 24px !important;
  color: var(--muted);
  text-align: center;
}

.loading-state {
  width: min(900px, calc(100vw - 32px));
  margin: clamp(32px, 10vh, 96px) auto 0;
  padding: clamp(22px, 4vw, 32px);
  text-align: left;
}

.loading-icon {
  display: inline-flex;
  width: 52px;
  height: 52px;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  border: 1px solid var(--line-strong);
  border-radius: 18px;
  background: var(--color-surface-glass);
  color: var(--brand-strong);
  box-shadow: var(--shadow-glass);
}

.loading-copy h1 {
  margin: 4px 0 8px;
  font-size: clamp(24px, 3vw, 34px);
}

.loading-copy p:not(.eyebrow) {
  max-width: 560px;
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.loading-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 24px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  color: var(--color-text-secondary);
  font-size: 13px;
  font-weight: 500;
}

.loading-summary {
  min-width: 0;
}

.loading-progress-hint {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  text-align: right;
}

.loading-stream-map {
  position: relative;
  min-height: 326px;
  margin-top: 18px;
}

.loading-step-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 124px 0 0;
  padding: 0;
  list-style: none;
}

.loading-step-list li {
  --loading-state-color: var(--color-state-neutral);
  display: grid;
  min-height: 62px;
  grid-template-columns: minmax(250px, 1fr) minmax(90px, .7fr);
  align-items: center;
  color: var(--color-text-primary);
  font-size: 12px;
  font-weight: 500;
}

.loading-step-list li.is-loading {
  --loading-state-color: var(--color-state-selected);
}

.loading-step-list li.is-complete {
  --loading-state-color: var(--color-state-success);
}

.loading-step-list li.is-warning {
  --loading-state-color: var(--color-state-warning);
}

.loading-step-list li.is-error {
  --loading-state-color: var(--color-state-danger);
}

.loading-step-copy {
  display: grid;
  min-width: 0;
  min-height: 62px;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 12px;
  align-items: baseline;
  padding: 10px 12px;
  border: 1px solid color-mix(in srgb, var(--loading-state-color) 70%, var(--line));
  border-inline-end: 4px solid var(--loading-state-color);
  border-radius: 12px 2px 2px 12px;
  background: color-mix(in srgb, var(--loading-state-color) 5%, var(--panel-fill));
}

.loading-step-label {
  color: var(--color-text-primary);
  font-weight: 500;
}

.loading-step-label-short {
  display: none;
}

.loading-step-status,
.loading-step-detail {
  color: var(--loading-state-color);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.45;
}

.loading-step-detail {
  grid-column: 1 / -1;
  overflow-wrap: anywhere;
  color: var(--color-state-danger);
}

.loading-flow {
  position: relative;
  display: block;
  height: 2px;
  background: repeating-linear-gradient(to right, var(--line-strong) 0 4px, transparent 4px 9px);
}

.loading-flow-traveled {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--loading-progress);
  background: var(--loading-state-color);
  animation: loading-flow-fill var(--motion-fast) var(--motion-ease-out) both;
}

.loading-flow-particle {
  position: absolute;
  top: 50%;
  left: var(--loading-progress);
  width: 9px;
  height: 9px;
  border: 2px solid var(--panel-fill);
  border-radius: 50%;
  background: var(--loading-state-color);
  box-shadow: 0 0 0 1px var(--loading-state-color);
  transform: translate(-50%, -50%);
  animation: loading-flow-move var(--motion-fast) var(--motion-ease-out) both;
}

.loading-flow-percent {
  position: absolute;
  bottom: 8px;
  left: clamp(20px, var(--loading-progress), calc(100% - 20px));
  min-width: 36px;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--panel-fill);
  color: var(--loading-state-color);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
  text-align: center;
  transform: translateX(-50%);
  animation: loading-flow-label-move var(--motion-fast) var(--motion-ease-out) both;
}

.loading-dashboard-hub {
  position: absolute;
  top: 0;
  right: 0;
  display: flex;
  width: 124px;
  height: 100%;
  min-height: 326px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  background: var(--panel-fill);
  color: var(--color-text-primary);
  text-align: center;
}

.loading-dashboard-hub .icon {
  color: var(--brand-strong);
}

.loading-dashboard-hub small {
  color: var(--muted);
  font-size: 10px;
}

.loading-dashboard-hub[data-loading-phase="complete"] {
  border-color: var(--color-state-success);
  background: color-mix(in srgb, var(--color-state-success) 8%, var(--panel-fill));
}

.loading-dashboard-hub[data-loading-phase="error"] {
  border-color: var(--color-state-danger);
  background: color-mix(in srgb, var(--color-state-danger) 7%, var(--panel-fill));
}

@keyframes loading-flow-fill {
  from { width: var(--loading-progress-from); }
  to { width: var(--loading-progress); }
}

@keyframes loading-flow-move {
  from { left: var(--loading-progress-from); }
  to { left: var(--loading-progress); }
}

@keyframes loading-flow-label-move {
  from { left: clamp(20px, var(--loading-progress-from), calc(100% - 20px)); }
  to { left: clamp(20px, var(--loading-progress), calc(100% - 20px)); }
}

@media (max-width: 600px) {
  .loading-state {
    width: calc(100vw - 24px);
    padding: 18px 16px;
  }

  .loading-progress-hint {
    display: none;
  }

  .loading-stream-map {
    min-height: 386px;
  }

  .loading-step-list {
    margin-right: 72px;
  }

  .loading-step-list li {
    min-height: 74px;
    grid-template-columns: 112px minmax(0, 1fr);
  }

  .loading-step-copy {
    min-height: 74px;
    grid-template-columns: 1fr;
    gap: 2px;
    padding: 8px;
  }

  .loading-step-label-full {
    display: none;
  }

  .loading-step-label-short {
    display: block;
  }

  .loading-step-status {
    font-size: 10px;
  }

  .loading-dashboard-hub {
    width: 72px;
    min-height: 386px;
    padding: 8px;
  }

  .loading-dashboard-hub .icon {
    display: none;
  }

  .loading-flow-percent {
    bottom: 7px;
    min-width: 32px;
    padding-inline: 3px;
    font-size: 9px;
  }
}

.loading-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 16px;
}

.loading-actions .secondary-button {
  display: inline-flex;
  width: 100%;
  min-width: 0;
  align-items: center;
  justify-content: center;
  background: var(--control-surface);
  text-align: center;
  text-decoration: none;
}

.error-state,
.empty-state {
  margin: 24px;
  padding: 24px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }

  .glow {
    animation: none !important;
    opacity: 1;
    transform: none;
  }

  .custom-select-panel,
  .save-toast,
  .page-tab-indicator,
  .fcst-status-chip-tooltip {
    transition: none !important;
  }

  .fcst-status-chip-tooltip {
    transform: translate(-50%, 0);
  }

  .fcst-status-chip:hover .fcst-status-chip-tooltip,
  .fcst-status-chip:focus-visible .fcst-status-chip-tooltip {
    transition-delay: 0s;
    transform: translate(-50%, 0);
  }

  .form-field.is-shaking,
  .add-row-form .custom-select.is-shaking,
  .add-row-form .control-input.is-shaking {
    animation: none !important;
    transform: none !important;
  }

  .filter-chip-clear {
    transition: none !important;
    transform: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .section-heading,
  .custom-select-panel {
    background: var(--color-surface-glass);
  backdrop-filter: none;
  }

  .page-tabs,
  .fcst-status-strip,
  .view-panel,
  .page-tabs-row .page-tab.is-active,
  .page-tab-indicator {
    background-color: var(--panel-fill, var(--color-surface-page));
    background-image: none;
  backdrop-filter: none;
  }
}

@media (prefers-contrast: more) {
  .page-tabs,
  .fcst-status-strip,
  .section-heading,
  .custom-select-panel,
  .custom-select-trigger,
  .primary-button,
  .secondary-button,
  .danger-button,
  .view-panel,
  .page-tabs-row .page-tab.is-active {
    border-color: currentColor;
  }
}

@media (hover: hover) and (pointer: fine) {
  .page-tab:hover {
    background: var(--color-surface-glass);
    border-color: transparent;
    color: var(--brand-strong);
  }

  .page-tabs-row .page-tab.is-active:hover {
    border-color: var(--tab-edge);
    border-bottom-color: transparent !important;
  }

  .custom-select-trigger:hover {
    border-color: rgba(var(--brand-rgb), 0.42);
    background: var(--color-surface-glass);
  }

  .chip-select .custom-select-trigger:hover {
    background: var(--color-surface-glass-hover);
  }

  /* 表頭篩選與一般控制項維持相同焦點對比。 */
  .header-filter .custom-select-trigger:hover {
    border-color: var(--color-surface-glass);
    color: var(--brand-strong);
  }

  .header-filter .custom-select-trigger:hover > .icon {

}

.decision-overview-header {
  display: grid;

}

.decision-overview-header .gmipo-calendar-heading h2 {
  max-width: 760px;
  font-size: clamp(27px, 3vw, 38px);
}

.decision-overview-scope {
  display: grid;

  <body>
    <div class="demo-banner" role="status">展示站 · 資料已去識別化 · 靜態網頁</div>
    <div id="app">
      <header class="app-header glass-panel">
        <div class="brand-copy"><h1>PSI 資料關係（展示站）</h1></div>
        <div class="source-meta"><span class="meta-chip">v36.11.47</span></div>
      </header>
      <main class="workspace">
        <section class="data-relations-card glass-card">
          <div class="data-relations-mode-switch" role="tablist" aria-label="資料關係模式">
            <button class="page-tab is-active" type="button" data-relation-mode="fields">欄位關係</button>
            <button class="page-tab" type="button" data-relation-mode="backend">後端資料關係</button>
            <button class="page-tab" type="button" data-relation-mode="flow">流程導覽</button>
          </div>
          <iframe class="data-relations-archify-frame" src="architecture/psi-dashboard-fields.architecture.html" title="欄位關係" data-archify-frame></iframe>
        </section>
      </main>
    </div>
    <script>
const views = {
  fields: ["architecture/psi-dashboard-fields.architecture.html", "欄位關係"],
  backend: ["architecture/psi-dashboard-backend.architecture.html", "後端資料關係"],
  flow: ["architecture/psi-dashboard-flow.architecture.html", "流程導覽"],
};
const buttons = Array.from(document.querySelectorAll("[data-relation-mode]"));
const frame = document.querySelector("[data-archify-frame]");
function show(mode) {
  buttons.forEach((button) => {
    const on = button.dataset.relationMode === mode;
    button.classList.toggle("is-active", on);
  });
  const [src, title] = views[mode] || views.fields;
  frame.src = src;
  frame.title = title;
}
buttons.forEach((button) => button.addEventListener("click", () => show(button.dataset.relationMode)));
    </script>
  </body>
